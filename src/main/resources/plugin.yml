name: JiuJiublbl
version: '${version}'
main: online.bingzi.bilibili.video.JiuJiublbl
api-version: '26.2'
folia-supported: true
authors: [BingZi-233, JiuJiu]
description: 哔哩哔哩三连奖励与内置GUI
softdepend: [JiuJiuLib, PlaceholderAPI]
commands:
  jjblbl:
    aliases: [bv, bilibili, jiublbl]
    description: 哔哩哔哩三连活动
    usage: /jjblbl help
    permission: bilibili.video.use
permissions:
  bilibili.video.use:
    default: true
  bilibili.video.admin:
    default: op
  bilibili.video.testreward:
    description: 允许管理员重复执行当前活动奖励测试，不改领取记录
    default: op
