reward:
  # 奖励判重策略
  # PLAYER_AND_BILIBILI - 玩家和 B 站账户同时记录（最严格：同一玩家 + 同一 B 站号只能领一次）
  # BILIBILI_ONLY       - 仅记录 B 站账户（同一 B 站号只能领一次，玩家换号可重新领）
  # PLAYER_ONLY         - 仅记录玩家（同一玩家只能领一次，换号无法重新领，默认值，兼容旧版本行为）
  dedup-strategy: "PLAYER_ONLY"

  templates:
    default:
      description: "钻石×1、牛排×16、附魔之瓶×16"
      kether:
        # 控制台发放；玩家名由PlaceholderAPI替换，命令不加斜杠。
        - 'command papi "minecraft:give %player_name% minecraft:diamond 1" by console'
        - 'command papi "minecraft:give %player_name% minecraft:cooked_beef 16" by console'
        - 'command papi "minecraft:give %player_name% minecraft:experience_bottle 16" by console'
        - 'tell "&f[&5Bilibili&f] 感谢你支持啾啾服务器！三连礼物：钻石×1、牛排×16、附魔之瓶×16。"'

    vip:
      description: "示例：某些视频使用更高档奖励"
      kether:
        - 'tell "&b你成功三连了啾啾服务器的宣传视频并且&c收到了一份小礼物"'

  # 宣传视频活动；这里只填BV号，不填完整网址。
  videos:
    BV1oHyjzMEXM:
      rewardKey: "default"

# 资源安全限制；修改以下项目后完整重启，reload仅重载奖励配置。
safety:
  # 后台联网和数据库工作线程数，1～16；默认4适合轻量活动。
  io-threads: 4
  # 等待队列8～1024；队列满会拒绝新请求，避免内存持续增长。
  io-queue: 128
  # 同时受理的玩家操作1～512；每个玩家同一时间只处理一个请求。
  max-operations: 64
  # 同时保存的二维码会话1～512，过期或退出自动清理。
  max-login-sessions: 128
  # 扫码查询间隔2～30秒，越小B站接口压力越高。
  poll-seconds: 3
  # 登录会话30～180秒，不能超过B站二维码有效期。
  session-seconds: 180
  # 单次HTTP完整超时3～30秒；连接/读写还有独立较短超时。
  http-timeout-seconds: 15
  # 仅客户端显示的地图ID，10亿～2147483647；与其他虚拟地图插件冲突时调整。
  virtual-map-id: 2000000001
