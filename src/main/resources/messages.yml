# 玩家提示正文；修改后执行 /jjblbl reload，无需重启或重发CE。
# 支持&颜色、普通文字或多行列表；空字符串/空列表关闭该条提示。
# [BV]自动替换为chat-style.yml的前缀；也可在任意位置写{prefix}。
# 花括号是内容变量，名称必须保留；替换只执行一次，不执行命令或脚本。
# GUI按钮/标签仍在gui.yml，奖励自定义message动作仍在config.yml。
# 缺少的键采用内置默认；无效类型使本次提示重载失败并保留旧值。

# 仅管理员本人测试；同时需要admin和testreward权限，旧消息文件缺少本节时使用默认值。
test-reward:
  usage: '[BV] 管理员测试：/jjblbl testreward [BV号]；只有一个活动时可省略BV号。'
  # 可用变量：{bvid}
  started: '[BV] &e开始测试发放 {bvid} 的整份奖励，本次不记录正式领取。'
  # console动作仅确认命令被受理，必须核对第三方钥匙真实到账。
  success: '[BV] &a测试奖励动作执行完成，可再次测试；请核对物品和钥匙到账数量。'
  failed: '[BV] &c测试奖励执行异常，可能已有部分到账，请先核对再重试。'
  # 可用变量：{reason}
  rejected: '[BV] &c无法开始测试发奖：{reason}'

